# ─────────────────────────────────────────────────────────────────────────────
# Server configuration
# ─────────────────────────────────────────────────────────────────────────────

# Port the embedded Tomcat server will listen on
server.port=8080

# ─────────────────────────────────────────────────────────────────────────────
# API Key Security
# ─────────────────────────────────────────────────────────────────────────────

# The valid API key that clients must supply in the X-API-KEY request header.
# Override this value in production using the API_KEY environment variable:
#   export API_KEY=your-secret-key
api.key=${API_KEY:changeme-replace-in-production}

# ─────────────────────────────────────────────────────────────────────────────
# Database (H2 in-memory — for development only)
# ─────────────────────────────────────────────────────────────────────────────

# H2 in-memory datasource — data is lost on restart (suitable for dev/test)
spring.datasource.url=jdbc:h2:mem:co2db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 console for browsing the in-memory database at /h2-console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─────────────────────────────────────────────────────────────────────────────
# Springdoc OpenAPI / Swagger UI
# ─────────────────────────────────────────────────────────────────────────────

# Path where the OpenAPI JSON spec is served
springdoc.api-docs.path=/v3/api-docs

# Path for the Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Automatically redirect /swagger-ui.html to the full UI path
springdoc.swagger-ui.enabled=true

# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────

# Log level for the application's own packages
logging.level.com.co2api=DEBUG
